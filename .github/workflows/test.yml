name: AL Bot Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnostic isolated tests
        run: |
          npm run build
          echo "=== H21 V3 group/resource ==="
          timeout 30s node --test tests/h21-v3-group-resource.test.mjs
          echo "=== H20 account strategy ==="
          timeout 30s node --test tests/h20-account-strategy.test.mjs
          echo "=== Remaining suites, isolated per file ==="
          for f in tests/*.test.mjs; do
            case "$f" in
              tests/h20-account-strategy.test.mjs|tests/h21-v3-group-resource.test.mjs) continue ;;
            esac
            echo "=== FILE $f ==="
            timeout 20s node --test "$f"
          done
      - name: One-shot sync generated dist
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/al-bot.js
          if git diff --cached --quiet; then
            echo "Generated dist already synchronized."
            exit 0
          fi
          git commit -m "build: sync generated H21 bundle"
          git push origin "HEAD:$HEAD_REF"
