name: AL Bot Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: h18-dist
          path: dist/al-bot.js
          if-no-files-found: error
      - name: Emit generated bundle
        run: |
          echo ALBOT_DIST_B64_START
          base64 -w0 dist/al-bot.js
          echo
          echo ALBOT_DIST_B64_END
