name: AL Bot Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnostic isolated tests
        run: |
          npm run build
          echo "=== H21 V3 group/resource ==="
          timeout 30s node --test tests/h21-v3-group-resource.test.mjs
          echo "=== H20 account strategy ==="
          timeout 30s node --test tests/h20-account-strategy.test.mjs
          echo "=== Remaining suites, isolated per file ==="
          for f in tests/*.test.mjs; do
            case "$f" in
              tests/h20-account-strategy.test.mjs|tests/h21-v3-group-resource.test.mjs) continue ;;
            esac
            echo "=== FILE $f ==="
            timeout 20s node --test "$f"
          done
