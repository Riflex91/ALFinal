name: ALFinal Host Stable Release

on:
  push:
    branches: [main]
    paths:
      - 'release/al-bot-release.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alfinal-host-stable
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate pinned stable source and run all tests
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(node -p "require('./release/al-bot-release.json').commitSha")"
          PKG_VERSION="$(node -p "require('./release/al-bot-release.json').packageVersion")"
          CHANNEL="$(node -p "require('./release/al-bot-release.json').channel")"
          PRODUCT="$(node -p "require('./release/al-bot-release.json').product")"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$CHANNEL" = "stable" ]
          [ "$PRODUCT" = "AL Bot" ]
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          git worktree add --detach ./pinned-host-source "$RELEASE_SHA"
          cd pinned-host-source
          [ "$(node -p "require('./package.json').version")" = "$PKG_VERSION" ]
          test -f host/durable-storage.mjs
          test -f host/telemetry-recorder.mjs
          test -f host/h22-host-watchdog.mjs
          CI=true npm test

      - name: Build fixed host archive and immutable-source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('pinned-host-source')
          stable = json.loads(pathlib.Path('release/al-bot-release.json').read_text())
          sha = stable['commitSha']
          assert len(sha) == 40 and all(c in '0123456789abcdef' for c in sha)
          names = ['telemetry-recorder.mjs','h22-host-watchdog.mjs','durable-storage.mjs']
          out = pathlib.Path('host-release')
          out.mkdir()
          archive = out / 'albot-host.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in names:
                  data = (root / 'host' / name).read_bytes()
                  assert 0 < len(data) <= 4*1024*1024
                  z.writestr(name, data)
          payload = archive.read_bytes()
          assert 100 <= len(payload) <= 8 * 1024 * 1024
          manifest = {
              'schemaVersion': 1,
              'product': 'AL Bot Local Host',
              'channel': 'stable',
              'packageVersion': stable['packageVersion'],
              'commitSha': sha,
              'assetUrl': 'https://github.com/Riflex91/ALFinal/releases/download/albot-host-latest/albot-host.zip',
              'sha256': hashlib.sha256(payload).hexdigest(),
              'bytes': len(payload),
              'releasedAt': stable['releasedAt'],
          }
          (out/'albot-host.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print('Pinned host release:', manifest['packageVersion'], manifest['commitSha'], manifest['bytes'])
          PY

      - name: Publish pinned and tested host to fixed stable lane
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='albot-host-latest'
          RELEASE_SHA="$(node -p "require('./release/al-bot-release.json').commitSha")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            ./host-release/albot-host.zip \
            ./host-release/albot-host.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title 'ALFinal Local SSD Host — stable' \
            --notes "Pinned, fully tested ALFinal stable host scripts from $RELEASE_SHA."
